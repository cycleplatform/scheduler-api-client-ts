name: Run Tests

on:
    - push
    - workflow_dispatch

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 25
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Tests
              run: npm run test

            - name: Build library
              run: npm run build:lib

            # Catches published type resolution breakage - a client whose types
            # do not resolve degrades to `any` for consumers instead of failing.
            - name: Check published types
              run: npm run test:pack
